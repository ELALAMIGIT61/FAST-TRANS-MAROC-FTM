# .github/workflows/deploy_supabase.yml
# Déploiement automatique des migrations SQL et Edge Functions
# Déclenché sur push vers la branche 'main'

name: Deploy Supabase FTM

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
  workflow_dispatch:

env:
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:

  lint:
    name: Lint SQL Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Validate migrations syntax
        run: |
          echo "✅ Validating SQL migrations..."
          supabase db diff --local || true
          echo "✅ Lint complete"

  deploy-migrations:
    name: Deploy DB Migrations
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Link Supabase project
        run: |
          supabase link \
            --project-ref ${{ env.SUPABASE_PROJECT_ID }} \
            --password ${{ env.SUPABASE_DB_PASSWORD }}

      - name: Run pending migrations
        run: |
          echo "🚀 Applying migrations..."
          supabase db push
          echo "✅ Migrations applied"

      - name: Verify migrations status
        run: |
          echo "📋 Migration history:"
          supabase migration list

  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: deploy-migrations
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Link Supabase project
        run: |
          supabase link \
            --project-ref ${{ env.SUPABASE_PROJECT_ID }} \
            --password ${{ env.SUPABASE_DB_PASSWORD }}

      - name: Set SMS secrets (only those present in GitHub Secrets)
        # Option B, lot SMS-2 (11/11/2026) : transmet a Supabase les cles rangees
        # dans GitHub Secrets. Une cle absente est ignoree (le deploiement continue).
        # Les valeurs ne sont jamais affichees (GitHub les masque en plus).
        env:
          ADASMS_API_KEY: ${{ secrets.ADASMS_API_KEY }}
          ADASMS_SENDER_ID: ${{ secrets.ADASMS_SENDER_ID }}
          SEND_SMS_HOOK_SECRET: ${{ secrets.SEND_SMS_HOOK_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
        run: |
          f="$(mktemp)"
          for n in ADASMS_API_KEY ADASMS_SENDER_ID SEND_SMS_HOOK_SECRET TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_FROM TWILIO_MESSAGING_SERVICE_SID; do
            if [ -n "${!n}" ]; then printf '%s=%s\n' "$n" "${!n}" >> "$f"; echo "secret $n : transmis"; else echo "secret $n : absent (ignore)"; fi
          done
          if [ -s "$f" ]; then supabase secrets set --env-file "$f" --project-ref "$SUPABASE_PROJECT_ID" > /dev/null; fi
          rm -f "$f"

      - name: Deploy all Edge Functions
        run: |
          echo "🚀 Deploying Edge Functions..."
          supabase functions deploy send-push-notification
          supabase functions deploy register-push-token
          supabase functions deploy check-document-reminders
          supabase functions deploy send-tracking-sms
          supabase functions deploy send-sms --no-verify-jwt
          echo "✅ All Edge Functions deployed"

      - name: Verify functions deployment
        run: |
          echo "📋 Deployed functions:"
          supabase functions list

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-functions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test Supabase connectivity
        run: |
          echo "🔍 Testing Supabase connection..."
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://${{ env.SUPABASE_PROJECT_ID }}.supabase.co/rest/v1/profiles?limit=1" \
            | jq '. | length' \
            && echo "✅ Database reachable"

      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 FTM Supabase deployment completed successfully!"
          echo "   Project: ${{ env.SUPABASE_PROJECT_ID }}"
          echo "   Branch:  ${{ github.ref_name }}"
          echo "   Commit:  ${{ github.sha }}"

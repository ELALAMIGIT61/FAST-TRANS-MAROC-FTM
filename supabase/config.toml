# Configuration minimale pour Supabase CLI
# Ce fichier permet à la CLI de reconnaître votre projet
#
# ATTENTION : ne JAMAIS lancer « supabase config push » sur ce projet.
# L'outil Supabase envoie toute la partie connexion (auth) : tout réglage absent
# de ce fichier reprendrait sa valeur par défaut, ce qui pourrait couper la
# connexion par SMS en production. Les réglages de connexion sont gérés dans le
# tableau de bord Supabase (décision du porteur du 11/11/2026).

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

# Lot 6 (E1) : ancien nom [inbucket], déprécié par l'outil Supabase (sans effet en production)
[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[realtime]
enabled = true

[edge_runtime]
enabled = true
